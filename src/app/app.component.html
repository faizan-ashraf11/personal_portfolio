<header class="bg-white flex flex-row py-2 px-3 ">
    <div class="w-3/12 px-4">
      <div class="flex flex-row gap-1 w-fit hover:cursor-pointer">
        <span class="text-2xl fontCOmmon">FX</span>
        <span class="bg-[#007accc2] py-1 px-1.5 rounded-full h-3 mt-5"></span>
        <span class="text-2xl fontCOmmon">Barrel</span>
      </div>
    </div>
    <div class="w-9/12 gap-9 sm:flex hidden flex-row items-center justify-end mr-10">
      <span class="fontCOmmon text-sm headerHover hover:cursor-pointer" [routerLink]="['/home']" [ngClass]="{'headActive': router.url == '/home'}">Home</span>
      <span class="fontCOmmon text-sm headerHover hover:cursor-pointer" [routerLink]="['/portfolios']" routerLinkActive="router-link-active"  [ngClass]="{'headActive': router.url == '/portfolios'}">Portfolios</span>
      <span class="fontCOmmon text-sm headerHover hover:cursor-pointer" (click)="scrollDownContactMe()">Contact Me</span>
      <span *ngIf="router.url == '/home'" class="fontCOmmon text-sm headerHover hover:cursor-pointer" (click)="scrollDownAbout()">About</span>
      <button class="button" (click)="downloadFile()" >
        <p class="text">Download CV</p>
      </button>
    </div>
    <button class="button ml-auto sm:hidden block" (click)="downloadFile()" >
      <p class="text">Download CV</p>
    </button>
</header>
<router-outlet></router-outlet>
